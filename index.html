<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Inventory Management</title>
    <!-- Tailwind CSS for clean UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <!-- Header & Export Action -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Real Estate Inventory System</h1>
                <p class="text-sm text-gray-500">Property Management Division</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportToHTML()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Export Searched to HTML (with Photos)
                </button>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="searchInput" placeholder="Search properties, remarks, locations..." onkeyup="filterTable()" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="typeFilter" onchange="filterTable()" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Property Types</option>
                <option value="Residential">Residential</option>
                <option value="Commercial">Commercial</option>
                <option value="Industrial">Industrial</option>
            </select>
            <select id="statusFilter" onchange="filterTable()" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Statuses</option>
                <option value="Available">Available</option>
                <option value="Sold">Sold</option>
                <option value="Pending">Pending</option>
            </select>
        </div>

        <!-- Inventory Table -->
        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table class="min-w-full divide-y divide-gray-200" id="inventoryTable">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Photo</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Property Name / Details</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Remarks</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                    <!-- Populated dynamically via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Photo Modal Viewer -->
    <div id="photoModal" class="fixed inset-0 bg-black bg-opacity-75 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-2xl w-full p-4 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-2xl font-bold">&times;</button>
            <img id="modalImage" src="" alt="Property Preview" class="w-full h-auto max-h-[80vh] object-contain rounded-lg mx-auto">
        </div>
    </div>

    <script>
        // Sample Inventory Data Set (Replace with live Google Sheets / MongoDB feed as needed)
        let inventoryData = [
            { id: 1, name: "Sunset Heights Villa", type: "Residential", status: "Available", remarks: "Prime location with ocean view", photo: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Downtown Commercial Hub", type: "Commercial", status: "Pending", remarks: "High foot traffic area", photo: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Industrial Warehouse A", type: "Industrial", status: "Available", remarks: "Equipped with loading docks", photo: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80" }
        ];

        let filteredData = [...inventoryData];

        // Render main dashboard table
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-6 text-center text-gray-500">No matching records found.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <img src="${item.photo}" alt="${item.name}" class="h-12 w-12 object-cover rounded shadow cursor-pointer hover:opacity-80 transition" onclick="openModal('${item.photo}')" onerror="this.src='https://via.placeholder.com/80?text=No+Photo'">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${item.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${item.type}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2.5 py-0.5 inline-flex text-xs leading-5 font-semibold rounded-full ${item.status === 'Available' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${item.status}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${item.remarks}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="openModal('${item.photo}')" class="text-blue-600 hover:text-blue-900 mr-3">View Photo</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Advanced filter function for search input and dropdowns
        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const typeVal = document.getElementById('typeFilter').value;
            const statusVal = document.getElementById('statusFilter').value;

            filteredData = inventoryData.filter(item => {
                const matchesQuery = item.name.toLowerCase().includes(query) || item.remarks.toLowerCase().includes(query);
                const matchesType = typeVal === '' || item.type === typeVal;
                const matchesStatus = statusVal === '' || item.status === statusVal;
                return matchesQuery && matchesType && matchesStatus;
            });

            renderTable(filteredData);
        }

        // Modal Controls
        function openModal(photoUrl) {
            document.getElementById('modalImage').src = photoUrl;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.add('hidden');
        }

        // Fully Restored exportToHTML Function with Photos & Print Capability
        function exportToHTML() {
            let htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Real Estate Inventory - Searched Report</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 30px; color: #333; }
                        h1 { color: #1a365d; margin-bottom: 5px; }
                        p { color: #666; margin-top: 0; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border: 1px solid #cbd5e0; padding: 12px; text-align: left; vertical-align: middle; }
                        th { background-color: #2b6cb0; color: white; font-weight: bold; }
                        img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; }
                        .print-btn { margin-bottom: 20px; padding: 10px 20px; background-color: #3182ce; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
                        .print-btn:hover { background-color: #2b6cb0; }
                        @media print { 
                            .print-btn { display: none; } 
                            body { margin: 0; }
                        }
                    </style>
                </head>
                <body>
                    <h1>Real Estate Inventory Report</h1>
                    <p>Searched & Filtered Dataset — Generated on: ${new Date().toLocaleString()}</p>
                    <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
                    <table>
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>Property Name / Details</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (filteredData.length === 0) {
                htmlContent += `<tr><td colspan="5" style="text-align: center; padding: 20px;">No records found in current search filter.</td></tr>`;
            } else {
                filteredData.forEach(item => {
                    htmlContent += `
                        <tr>
                            <td><img src="${item.photo}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80?text=No+Photo'"></td>
                            <td><strong>${item.name}</strong></td>
                            <td>${item.type}</td>
                            <td>${item.status}</td>
                            <td>${item.remarks}</td>
                        </tr>
                    `;
                });
            }

            htmlContent += `
                        </tbody>
                    </table>
                </body>
                </html>
            `;

            // Create Blob and trigger file download
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Real_Estate_Inventory_Report_${new Date().toISOString().slice(0,10)}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize table view on load
        renderTable(inventoryData);
    </script>
</body>
</html>
